name: Deploy to Pages

# Builds and publishes to GitHub Pages (https://fabianlander.github.io/low-vertex-flat-tori/):
#   - the `rich-birthday` render, at the site ROOT (unchanged URL), and
#   - the `imaginary-moduli` demo, at /imaginary-moduli/.
# Each build is self-contained (Vite base './'), so it serves correctly at any path.
# GitHub Pages serves one site per repo, so both ship from this single workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to push to Pages, and let the action mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build rich-birthday
      - run: npm run build imaginary-moduli
      - run: npm run build square-torus-slice

      # Assemble the Pages site: rich-birthday at the root, the others in
      # subfolders (so imaginary-moduli's "Investigate" button can link to
      # ../square-torus-slice/). imaginary-moduli reads only its committed data/
      # — the gitignored live/ symlinks aren't in CI, so the public site shows
      # just the curated examples.
      - run: |
          mkdir -p site
          cp -r dist/rich-birthday/. site/
          cp -r dist/imaginary-moduli site/imaginary-moduli
          cp -r dist/square-torus-slice site/square-torus-slice

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
