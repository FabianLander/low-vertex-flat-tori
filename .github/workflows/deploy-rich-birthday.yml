name: Deploy to Pages

# Builds and publishes to GitHub Pages (https://fabianlander.github.io/low-vertex-flat-tori/):
#   - the `rich-birthday` render, at the site ROOT (unchanged URL), and
#   - the `torus-moduli` picker, at /torus-moduli/, plus the `torus-inspector`
#     detail view it links to, at /torus-inspector/.
# Each build is self-contained (Vite base './'), so it serves correctly at any path.
# GitHub Pages serves one site per repo, so both ship from this single workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to push to Pages, and let the action mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build rich-birthday
      - run: npm run build torus-moduli
      - run: npm run build torus-inspector

      # Assemble the Pages site: rich-birthday at the root, the others in
      # subfolders (so torus-moduli's "Investigate" button can link to
      # ../torus-inspector/). torus-moduli reads only its committed data/
      # — the gitignored live/ symlinks aren't in CI, so the public site shows
      # just the curated examples.
      - run: |
          mkdir -p site
          cp -r dist/rich-birthday/. site/
          cp -r dist/torus-moduli site/torus-moduli
          cp -r dist/torus-inspector site/torus-inspector

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
